name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: api
            dockerfile: infra/docker/api.release.Dockerfile
          - name: web
            dockerfile: infra/docker/web.release.Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/growthagent-${{ matrix.name }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Build launchers
        env:
          VERSION: ${{ github.ref_name }}
          MANAGED_LLM_BASE_URL: ${{ vars.MANAGED_LLM_BASE_URL }}
          MANAGED_LLM_MODEL: ${{ vars.MANAGED_LLM_MODEL }}
          MANAGED_LLM_GATEWAY_TOKEN: ${{ secrets.MANAGED_LLM_GATEWAY_TOKEN }}
        run: |
          test -n "$MANAGED_LLM_BASE_URL"
          test -n "$MANAGED_LLM_MODEL"
          test -n "$MANAGED_LLM_GATEWAY_TOKEN"
          mkdir -p build dist
          LDFLAGS="-s -w -X main.version=${VERSION} -X main.managedLLMBaseURL=${MANAGED_LLM_BASE_URL} -X main.managedLLMModel=${MANAGED_LLM_MODEL} -X main.managedLLMGatewayToken=${MANAGED_LLM_GATEWAY_TOKEN}"
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "$LDFLAGS" -o dist/GrowthAgent-Windows-x64.exe ./cmd/threadpilot-launcher
          GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags "$LDFLAGS" -o build/GrowthAgent-macOS-arm64 ./cmd/threadpilot-launcher
          GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags "$LDFLAGS" -o build/GrowthAgent-macOS-x64 ./cmd/threadpilot-launcher
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "$LDFLAGS" -o build/GrowthAgent-Linux-x64 ./cmd/threadpilot-launcher
          chmod +x build/GrowthAgent-macOS-arm64 build/GrowthAgent-macOS-x64 build/GrowthAgent-Linux-x64
          tar -czf dist/GrowthAgent-macOS-arm64.tar.gz -C build GrowthAgent-macOS-arm64
          tar -czf dist/GrowthAgent-macOS-x64.tar.gz -C build GrowthAgent-macOS-x64
          tar -czf dist/GrowthAgent-Linux-x64.tar.gz -C build GrowthAgent-Linux-x64
          cd dist && sha256sum * > SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: launchers
          path: dist/*

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [images, binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: launchers
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
