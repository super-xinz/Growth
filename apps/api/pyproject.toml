[project]
name = "growthagent-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.141.1", "uvicorn[standard]>=0.52.4", "pydantic-settings>=2.15.0",
  "sqlalchemy[asyncio]>=2.0.52", "asyncpg>=0.31.0", "alembic>=1.19.1",
  "httpx>=0.28.1", "beautifulsoup4>=4.15.0", "celery[redis]>=5.6.3",
  "openai>=3.3.1", "email-validator>=2.3.0", "python-multipart>=0.0.32",
  "cryptography>=50.0.0"
]
[project.optional-dependencies]
dev = ["pytest>=9.1.1", "pytest-asyncio>=1.4.0", "aiosqlite>=0.22.1", "ruff>=0.16.4"]

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["alembic*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = [".", "../.."]
[tool.ruff]
line-length = 100
